<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zikr Timer</title>
    <style>
        :root {
            --bg: #f4f4f4;
            --container-bg: #ffffff;
            --text: #000000;
            --label: #333333;
            --time: green;
            --duration: blue;
            --shadow: rgba(0,0,0,0.1);
        }
        body.dark {
            --bg: #1a1a1a;
            --container-bg: #2a2a2a;
            --text: #e0e0e0;
            --label: #bbbbbb;
            --time: #4caf50;
            --duration: #5b9bff;
            --shadow: rgba(0,0,0,0.5);
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px var(--shadow);
            transition: background-color 0.3s;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .display-section {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        .display-block {
            flex: 1;
        }
        .label {
            font-size: 14px;
            font-weight: bold;
            color: var(--label);
        }
        .time-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--time);
            margin-top: 5px;
        }
        .control-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .control-panel button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }
        .btn-start { background-color: green; }
        .btn-pause { background-color: orange; }
        .btn-reset { background-color: red; }
        .btn-reset:disabled { background-color: #ffcccc; cursor: not-allowed; }
        .settings-section {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .settings-group {
            flex: 1;
        }
        .settings-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .flex-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-sub-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-sub-group button {
            width: 35px;
            height: 35px;
            font-size: 18px;
            font-weight: bold;
            margin: 2px;
            cursor: pointer;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--label);
            border-radius: 5px;
        }
        .btn-label {
            font-size: 12px;
            margin: 4px 0;
        }
        .btn-val {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        .duration-display {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: var(--duration);
        }
        .settings-title { color: var(--text); }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .top-bar select,
        .theme-toggle {
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--label);
        }
        /* RTL support for Urdu */
        body.rtl {
            direction: rtl;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <select id="langSelect" onchange="setLanguage(this.value)">
            <option value="en">English</option>
            <option value="ur">اردو</option>
        </select>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
    </div>

    <div class="header" data-i18n="title">Zikr Timer</div>

    <div class="display-section">
        <div class="display-block">
            <div class="label" data-i18n="level">Level</div>
            <div id="ongoingLevel" class="time-display">00</div>
        </div>
        <div class="display-block">
            <div class="label" data-i18n="timerTime">Timer Time</div>
            <div id="timerTime" class="time-display">00:00:00</div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-start" onclick="startTimer()" data-i18n="start">Start</button>
        <button class="btn-pause" onclick="pauseTimer()" data-i18n="pause">Pause</button>
        <button class="btn-reset" id="resetBtn" onclick="resetTimer()" data-i18n="reset">Reset</button>
    </div>

    <div class="settings-section">
        <div class="settings-group">
            <div class="settings-title" data-i18n="timeInterval">Time Interval</div>
            <div class="flex-buttons">
                <div class="btn-sub-group">
                    <button onclick="changeVal('min', 1)">+</button>
                    <div class="btn-label" data-i18n="min">min</div>
                    <button onclick="changeVal('min', -1)">-</button>
                    <div id="valMin" class="btn-val">03</div>
                </div>
                <div class="btn-sub-group">
                    <button onclick="changeVal('sec', 1)">+</button>
                    <div class="btn-label" data-i18n="sec">sec</div>
                    <button onclick="changeVal('sec', -1)">-</button>
                    <div id="valSec" class="btn-val">13</div>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-title" data-i18n="levels">Levels</div>
            <div class="flex-buttons">
                <div class="btn-sub-group">
                    <button onclick="changeVal('lev', 1)">+</button>
                    <div class="btn-label" data-i18n="count">count</div>
                    <button onclick="changeVal('lev', -1)">-</button>
                    <div id="valLev" class="btn-val">14</div>
                </div>
            </div>
        </div>
    </div>

    <div id="timerDuration" class="duration-display"><span data-i18n="timerDuration">Timer Duration</span> 00:00:00</div>
</div>

<script>
    // Translations
    const translations = {
        en: {
            title: "Zikr Timer",
            level: "Level",
            timerTime: "Timer Time",
            start: "Start",
            pause: "Pause",
            reset: "Reset",
            timeInterval: "Time Interval",
            min: "min",
            sec: "sec",
            levels: "Levels",
            count: "count",
            timerDuration: "Timer Duration",
            dark: "🌙 Dark",
            light: "☀️ Light"
        },
        ur: {
            title: "ذکر ٹائمر",
            level: "سطح",
            timerTime: "ٹائمر کا وقت",
            start: "شروع",
            pause: "روکیں",
            reset: "ری سیٹ",
            timeInterval: "وقفہ",
            min: "منٹ",
            sec: "سیکنڈ",
            levels: "سطحیں",
            count: "تعداد",
            timerDuration: "کل دورانیہ",
            dark: "🌙 ڈارک",
            light: "☀️ لائٹ"
        }
    };

    let currentLang = 'en';
    let darkMode = false;

    function setLanguage(lang) {
        currentLang = translations[lang] ? lang : 'en';
        const dict = translations[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key] !== undefined) el.innerText = dict[key];
        });
        document.title = dict.title;
        document.documentElement.lang = currentLang;
        document.body.classList.toggle('rtl', currentLang === 'ur');
        document.getElementById('langSelect').value = currentLang;
        updateThemeButton();
        calculateDuration();
    }

    function updateThemeButton() {
        const dict = translations[currentLang];
        document.getElementById('themeToggle').innerText = darkMode ? dict.light : dict.dark;
    }

    function toggleTheme() {
        darkMode = !darkMode;
        document.body.classList.toggle('dark', darkMode);
        updateThemeButton();
    }

    // Configuration values
    let intervalMin = 3;
    let intervalSec = 13;
    let targetLevels = 14;

    // State values
    let timerRunning = false;
    let totalElapsedSeconds = 0;
    let currentLevel = 0;
    let intervalTimer = null;

    // Audio Context Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playBeep(count) {
        if (!audioCtx) audioCtx = new AudioContext();
        let delay = 0;
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }, delay);
            delay += 300; 
        }
    }

    function formatTwoDigits(num) {
        return num.toString().padStart(2, '0');
    }

    function formatTime(totalSeconds) {
        let hrs = Math.floor(totalSeconds / 3600);
        let mins = Math.floor((totalSeconds % 3600) / 60);
        let secs = totalSeconds % 60;
        return `${formatTwoDigits(hrs)}:${formatTwoDigits(mins)}:${formatTwoDigits(secs)}`;
    }

    function calculateDuration() {
        let singleIntervalSeconds = (intervalMin * 60) + intervalSec;
        let totalDurationSeconds = singleIntervalSeconds * targetLevels;
        document.getElementById('timerDuration').innerHTML =
            '<span data-i18n="timerDuration">' + translations[currentLang].timerDuration + '</span> ' +
            formatTime(totalDurationSeconds);
    }

    function updateSettingsDisplay() {
        document.getElementById('valMin').innerText = formatTwoDigits(intervalMin);
        document.getElementById('valSec').innerText = formatTwoDigits(intervalSec);
        document.getElementById('valLev').innerText = formatTwoDigits(targetLevels);
        calculateDuration();
    }

    function changeVal(type, amount) {
        if (timerRunning) return; 
        if (type === 'min') {
            intervalMin = Math.max(0, intervalMin + amount);
        } else if (type === 'sec') {
            intervalSec = intervalSec + amount;
            if (intervalSec > 59) intervalSec = 0;
            if (intervalSec < 0) intervalSec = 59;
        } else if (type === 'lev') {
            targetLevels = Math.max(1, targetLevels + amount);
        }
        updateSettingsDisplay();
    }

    function startTimer() {
        if (timerRunning) return;
        if ((intervalMin * 60 + intervalSec) === 0) return;

        timerRunning = true;
        document.getElementById('resetBtn').disabled = true;

        if (currentLevel === 0) currentLevel = 1;
        document.getElementById('ongoingLevel').innerText = formatTwoDigits(currentLevel);

        intervalTimer = setInterval(() => {
            totalElapsedSeconds++;
            document.getElementById('timerTime').innerText = formatTime(totalElapsedSeconds);

            let singleIntervalSeconds = (intervalMin * 60) + intervalSec;
            let currentLevelElapsed = totalElapsedSeconds % singleIntervalSeconds;

            if (currentLevelElapsed === 0) {
                if (currentLevel >= targetLevels) {
                    clearInterval(intervalTimer);
                    timerRunning = false;
                    document.getElementById('resetBtn').disabled = false;
                    playBeep(2); 
                } else {
                    currentLevel++;
                    document.getElementById('ongoingLevel').innerText = formatTwoDigits(currentLevel);
                    playBeep(1); 
                }
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(intervalTimer);
        timerRunning = false;
        document.getElementById('resetBtn').disabled = false;
    }

    function resetTimer() {
        if (timerRunning) return;
        clearInterval(intervalTimer);
        totalElapsedSeconds = 0;
        currentLevel = 0;
        document.getElementById('timerTime').innerText = "00:00:00";
        document.getElementById('ongoingLevel').innerText = "00";
    }

    // Initialize layout values
    updateSettingsDisplay();
</script>

</body>
</html>
