name: Build Android

on:
  workflow_dispatch:
    inputs:
      build-aab:
        description: "Also build an app bundle (.aab) for Play Store"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zikr_timer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # keep in sync with the local SDK
          cache: true

      - name: Decode signing keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        if: ${{ inputs.build-aab }}
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zikr-timer-apk
          path: zikr_timer/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to transfer.inovtra.com
        run: |
          URL=$(curl -fsS --upload-file build/app/outputs/flutter-apk/app-release.apk \
            "https://transfer.inovtra.com/zikr-timer-${GITHUB_RUN_NUMBER}.apk")
          echo "APK download: $URL"
          echo "### APK download" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload App Bundle
        if: ${{ inputs.build-aab }}
        uses: actions/upload-artifact@v4
        with:
          name: zikr-timer-aab
          path: zikr_timer/build/app/outputs/bundle/release/app-release.aab
