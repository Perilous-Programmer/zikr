name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zikr_timer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # keep in sync with the local SDK
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # No Apple signing secrets are configured, so this produces an UNSIGNED
      # build. Sign it later (e.g. with Xcode/fastlane/AltStore) before
      # installing on a device or shipping to the App Store.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr zikr-timer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zikr-timer-ios-unsigned
          path: zikr_timer/build/ios/ipa/zikr-timer-unsigned.ipa

      # Keep these! Without them, obfuscated crash stack traces can never be
      # decoded (flutter symbolize -d <symbols dir>).
      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: zikr-timer-ios-symbols
          path: zikr_timer/build/symbols

      - name: Upload IPA to transfer.inovtra.com
        run: |
          URL=$(curl -fsS --upload-file build/ios/ipa/zikr-timer-unsigned.ipa \
            "https://transfer.inovtra.com/zikr-timer-unsigned-${GITHUB_RUN_NUMBER}.ipa")
          echo "IPA download: $URL"
          echo "### IPA download" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
